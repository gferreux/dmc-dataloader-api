---
services:
  firestore:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command:
      - gcloud
      - emulators
      - firestore
      - start
      - --host-port=0.0.0.0:8080
    ports:
      - "8080:8080"

  api:
    build:
      context: .
      args:
        appName: dmc-dataloader-api
        appVersion: dev
    ports:
      - "3001:3001"
    environment:
      FIRESTORE_EMULATOR_HOST: firestore:8080
      DMC_FIRESTORE_PROJECT_ID: demo-dmc
      DMC_FIRESTORE_DATABASE_ID: dmc-data-loader-dev
      DMC_FIRESTORE_COLLECTION: load_config
      DMC_ORGANIZATIONS_PROJECT_ID: demo-dmc
      DMC_ORGANIZATIONS_DATABASE_ID: "(default)"
      DMC_ORGANIZATIONS_COLLECTION: organizations
      DMC_ORGANIZATIONS_ACCOUNTS_COLLECTION: accounts
      DMC_AUTH_MODE: none
      DMC_SERVER_CORS_ORIGINS: http://localhost:3002,https://3002-ws-gferreux.cluster-ut4kyuiqi5d5suqbh6cuvr2cbg.cloudworkstations.dev
      DMC_LOG_JSON: "false"
      # SFTPGO_API_KEY is a secret. Export it in the shell; do not commit it.
      SFTPGO_URL: ${SFTPGO_URL:-}
      SFTPGO_API_KEY: ${SFTPGO_API_KEY:-}
      DMC_SFTPGO_HOME_ROOT: ${DMC_SFTPGO_HOME_ROOT:-/srv/sftpgo/data}
    volumes:
      - ./config-debug.yaml:/app/config.yaml:ro
    depends_on:
      - firestore
