openapi: 3.0.3
info:
  title: dmc-dataloader-api
  version: 0.3.0
  description: |
    Console API for dmc-data-loader `load_config` documents.

    Persisted JSON matches the Firestore document described by
    `dekuple-labs/dmc-domain/pkg/model/data_loader_config.go`.
    `id` is the document id. `createTime` and `updateTime` are Firestore
    snapshot metadata. `partnerType`, `importType`, `kind`, `organizationName`,
    `nestedName`, and `fileType` are derived and are not written.

    Create and update send `kind`, `organizationName`, `nestedName`, and
    `fileType` plus `mode`, `bqParams`, and `mappings`. The server derives
    `id`, `publisherName`, `patterns`, `notification`, `destination`, and
    `organization`. Client values for those fields are ignored.
    `POST /api/v1/load-configs/derive` previews the computed block.

    Mapping `type` is the domain iota: 0 RENAME, 1 SQL, 2 PREFIX_PATTERN,
    3 CUSTOM, 4 EXTRA_FIELDS, 5 MISSING_MAPPINGS, 6 ARRAY. 7 (ND) is invalid.
    `bqParams.sourceFormat` is the integer 0 (CSV) or 1 (JSON).

    The loader walks the collection in Firestore's default order, which is
    document id ascending, and keeps the first document whose
    `patterns.preprocess` or `patterns.ingest` matches `bucket/objectName`.

    PUT replaces modeled fields and preserves any other document fields
    (`deactivated`, `incremental`, `mappings.<column>.isPartitionKey`, and
    anything else this API does not declare). `organization.account` and
    `bqParams.nullMarker` are nullable. `organization.type` values other than
    `advertiser` and `publisher` (including `referential`) can be read and are
    rejected when an update keeps that stored type. Create sets the type from `kind`.

    SFTP account routes provision SFTPGo users for a publisher or advertiser
    client. `referential` is not supported. `GET /api/v1/sftp-accounts/config` reports
    whether `SFTPGO_URL` and `SFTPGO_API_KEY` are set. The other SFTP routes
    return 503 when they are not. A generated password is returned once and is
    not logged.
servers:
  - url: /
tags:
  - name: health
  - name: load-configs
  - name: templates
  - name: organizations
  - name: meta
  - name: sftp-accounts
paths:
  /healthz:
    get:
      tags: [health]
      summary: Liveness probe
      responses:
        "200":
          description: Process is up
          content:
            text/plain:
              schema:
                type: string
                example: OK
  /api/v1/load-configs:
    get:
      tags: [load-configs]
      summary: List load configs
      parameters:
        - $ref: "#/components/parameters/partnerType"
        - $ref: "#/components/parameters/importType"
        - in: query
          name: q
          schema: {type: string}
          description: Case-insensitive match on id, names, destination, and patterns.
      responses:
        "200":
          description: Matching configs
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/LoadConfig"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
    post:
      tags: [load-configs]
      summary: Create a load config
      description: |
        Returns 422 when validation errors are present. Warnings (overlap,
        unanchored regex, and so on) do not block the write; call
        `/load-configs/validate` to see them.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LoadConfigWrite"}
      responses:
        "201":
          description: Created
          headers:
            Location:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LoadConfig"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Validation"}
  /api/v1/load-configs/derive:
    post:
      tags: [load-configs]
      summary: Preview the server-derived identity and plumbing
      description: |
        Computes the document id, publisherName, patterns, notification,
        destination, and organization. Does not write. `warnings` includes
        overlap with existing configs. Returns 422 when the wizard input is
        invalid or the organization or account cannot be resolved.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Identity"}
      responses:
        "200":
          description: Computed block
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DerivedConfig"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "422": {$ref: "#/components/responses/Validation"}
  /api/v1/load-configs/validate:
    post:
      tags: [load-configs]
      summary: Validate a document without writing it
      description: Always 200 when the body parses. Errors and warnings are in the body.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LoadConfig"}
      responses:
        "200":
          description: Validation report
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ValidationReport"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/v1/load-configs/test-pattern:
    post:
      tags: [load-configs]
      summary: Test a regex and report which stored config the loader would pick
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pattern, path]
              properties:
                pattern: {type: string}
                path:
                  type: string
                  description: Value the loader matches, `bucket/objectName`.
      responses:
        "200":
          description: Match result
          content:
            application/json:
              schema:
                type: object
                required: [matches, matchingConfigId]
                properties:
                  matches: {type: boolean}
                  matchingConfigId:
                    type: string
                    nullable: true
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "422": {$ref: "#/components/responses/Validation"}
  /api/v1/load-configs/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
    get:
      tags: [load-configs]
      summary: Get one load config
      responses:
        "200":
          description: The document
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LoadConfig"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
    put:
      tags: [load-configs]
      summary: Replace one load config
      description: |
        `mode`, `bqParams`, and `mappings` are replaced. Document fields this
        API does not model stay in place, including `deactivated`,
        `incremental`, and `isPartitionKey` inside a mapping that is still
        present. A mapping column omitted from the body is removed.

        Stored derived fields stay as they are when `kind`, `organizationName`,
        `nestedName`, and `fileType` are omitted or slug to the same document.
        That keeps legacy patterns such as `ciblexo/.+`. When those inputs
        change, the server re-derives the plumbing and moves the document to
        the new id. The response `Location` header is set in that case.
        409 means the new id already exists.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LoadConfigWrite"}
      responses:
        "200":
          description: Updated document. Location is set when the document id changed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LoadConfig"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Validation"}
    delete:
      tags: [load-configs]
      summary: Delete one load config
      responses:
        "204": {description: Deleted}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/organizations:
    get:
      tags: [organizations]
      summary: Organizations for the wizard autocomplete
      description: |
        Active organizations whose type matches `type`. When the organization
        source is unreachable or not permitted, the list is built from
        load_config and a warning is logged.
      parameters:
        - in: query
          name: type
          required: true
          schema: {type: string, enum: [advertiser, publisher]}
      responses:
        "200":
          description: Matching organizations
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/NamedRef"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/v1/organizations/{id}/accounts:
    get:
      tags: [organizations]
      summary: Advertiser accounts for one organization
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string}
          description: Organization document id.
      responses:
        "200":
          description: Accounts. Empty when the organization has none.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/NamedRef"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/v1/organizations/{slug}/bases:
    get:
      tags: [organizations]
      summary: Publisher base names already used in load_config paths
      parameters:
        - in: path
          name: slug
          required: true
          schema: {type: string}
          description: Slug of the publisher organization name.
        - in: query
          name: type
          required: true
          schema: {type: string, enum: [publisher]}
      responses:
        "200":
          description: Base names. `id` is omitted; a base has no document id.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/NamedRef"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/v1/templates:
    get:
      tags: [templates]
      summary: Recommended CSV schemas and starter documents
      responses:
        "200":
          description: Templates
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/Template"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/v1/meta:
    get:
      tags: [meta]
      summary: Closed sets used by the console
      responses:
        "200":
          description: Meta
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Meta"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/v1/sftp-accounts/config:
    get:
      tags: [sftp-accounts]
      summary: SFTP account form configuration
      description: |
        Returns 200 even when SFTPGo is not configured, with `configured: false`.
        The other SFTP routes return 503 in that case. Raw buckets are the derive
        raw buckets (`DMC_DERIVE_PUBLISHER_RAW_BUCKET` and
        `DMC_DERIVE_ADVERTISER_RAW_BUCKET`).
      responses:
        "200":
          description: Form metadata
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SFTPConfig"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/v1/sftp-accounts/{username}:
    get:
      tags: [sftp-accounts]
      summary: Read one SFTPGo user
      description: |
        Returns 200 with `exists: false` when SFTPGo has no such user.
        `bases` are the first path segments of the user's virtual folders.
      parameters:
        - in: path
          name: username
          required: true
          schema: {type: string}
      responses:
        "200":
          description: The user, or exists=false
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SFTPAccount"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "502": {$ref: "#/components/responses/BadGateway"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
  /api/v1/sftp-accounts/preview:
    post:
      tags: [sftp-accounts]
      summary: Dry-run an SFTP account change
      description: |
        Does not write. Bucket mismatches are 409 errors, not warnings.
        `userAction` is `create`, `update`, or `unchanged`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SFTPAccountRequest"}
      responses:
        "200":
          description: The plan
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SFTPPlan"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "409": {$ref: "#/components/responses/BucketMismatch"}
        "422": {$ref: "#/components/responses/Validation"}
        "502": {$ref: "#/components/responses/BadGateway"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
  /api/v1/sftp-accounts:
    post:
      tags: [sftp-accounts]
      summary: Create or extend an SFTPGo account
      description: |
        Creates the user when missing (201) or adds the base's virtual folders
        to an existing user (200). An existing password is kept. `passwordMode`
        `generate` (the default) returns `generatedPassword` once; it is not
        stored or logged. `none` requires `publicKeys`. After writing, the user
        is read back and `verified` reports whether every expected virtual path
        is present.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SFTPAccountRequest"}
      responses:
        "200":
          description: Existing user updated or already configured
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SFTPApplyResult"}
        "201":
          description: User created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SFTPApplyResult"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "409": {$ref: "#/components/responses/BucketMismatch"}
        "422": {$ref: "#/components/responses/Validation"}
        "502": {$ref: "#/components/responses/BadGateway"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
components:
  parameters:
    id:
      in: path
      name: id
      required: true
      schema: {type: string}
      description: Firestore document id, for example `acme:demo:sales`.
    partnerType:
      in: query
      name: partnerType
      schema: {type: string, enum: [publisher, advertiser]}
    importType:
      in: query
      name: importType
      schema:
        type: string
        enum: [optin, optout, blacklists, customers, stores, sales]
  responses:
    BadRequest:
      description: Malformed JSON or query
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    Unauthorized:
      description: Authenticator rejected the caller
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    NotFound:
      description: Document or route not found
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    Conflict:
      description: Document id already exists
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    Validation:
      description: Document failed validation
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    BucketMismatch:
      description: The SFTPGo user or virtual folder is on a different GCS bucket
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    BadGateway:
      description: SFTPGo returned an unexpected error. The message includes SFTPGo's trimmed body.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    ServiceUnavailable:
      description: SFTPGO_URL or SFTPGO_API_KEY is not set
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code: {type: string}
            message: {type: string}
            details:
              type: array
              items: {$ref: "#/components/schemas/FieldIssue"}
    FieldIssue:
      type: object
      required: [field, message]
      properties:
        field: {type: string}
        message: {type: string}
    ValidationReport:
      type: object
      required: [errors, warnings]
      properties:
        errors:
          type: array
          items: {$ref: "#/components/schemas/FieldIssue"}
        warnings:
          type: array
          items: {$ref: "#/components/schemas/FieldIssue"}
    LoadConfig:
      type: object
      required: [publisherName, mode, patterns, destination, organization, bqParams, mappings]
      properties:
        id: {type: string}
        createTime: {type: string, format: date-time, readOnly: true}
        updateTime: {type: string, format: date-time, readOnly: true}
        partnerType:
          type: string
          enum: [publisher, advertiser]
          description: Derived. Not stored.
        importType:
          type: string
          enum: [optin, optout, blacklists, customers, stores, sales]
          description: Derived. Not stored.
        kind:
          type: string
          readOnly: true
          enum: [advertiser, publisher]
          description: Wizard kind parsed from the id or patterns. Same value as partnerType when the document follows the convention.
        organizationName:
          type: string
          readOnly: true
          description: Slug of the organization, parsed from the id or patterns.
        nestedName:
          type: string
          readOnly: true
          description: Slug of the advertiser account or publisher base.
        fileType:
          type: string
          readOnly: true
          enum: [optin, optout, blacklists, customers, stores, sales]
          description: Import kind parsed from the id or patterns. Same value as importType.
        publisherName: {type: string}
        mode: {type: string, enum: [APPEND, INCREMENTAL, OVERWRITE]}
        patterns: {$ref: "#/components/schemas/Patterns"}
        destination: {$ref: "#/components/schemas/Destination"}
        organization: {$ref: "#/components/schemas/Organization"}
        notification: {$ref: "#/components/schemas/Notification"}
        bqParams: {$ref: "#/components/schemas/BQParams"}
        mappings:
          type: object
          additionalProperties: {$ref: "#/components/schemas/Mapping"}
    Patterns:
      type: object
      description: |
        Generated patterns are unanchored, matching existing load_config documents.
        A leading `gs://` must still be able to match.
      properties:
        preprocess:
          type: string
          example: dkp-dmc-advertisers-raw-euw1-dev/gadol/lissac/sales/.+[.](csv|zip|gz|gzip|tgz|tar.gz|7z)
        ingest:
          type: string
          example: dkp-dmc-advertisers-staging-euw1-dev/data/[0-9]{4}-[01][0-9]-[0-3][0-9]T[0-2][0-9]:[0-5][0-9]:[0-5][0-9]Z/gadol/lissac/sales/.+
    Destination:
      type: object
      required: [projectId, datasetId, tableId]
      properties:
        projectId: {type: string}
        datasetId: {type: string}
        tableId: {type: string}
    Organization:
      type: object
      required: [type]
      properties:
        id: {type: string}
        account: {type: string, nullable: true}
        type:
          type: string
          description: |
            Writes accept `advertiser` or `publisher`. Reads also return
            `referential` when a stored document has it.
    Notification:
      type: object
      properties:
        projectId: {type: string}
        topicId: {type: string}
    BQParams:
      type: object
      required: [skipLeadingRows, sourceFormat]
      properties:
        fieldDelimiter: {type: string}
        skipLeadingRows: {type: integer, format: int64}
        nullMarker: {type: string, nullable: true}
        quote: {type: string}
        sourceFormat:
          type: integer
          enum: [0, 1]
          description: 0 is CSV. 1 is JSON. Firestore stores this integer.
    Mapping:
      type: object
      required: [src, type]
      properties:
        src: {type: string, description: CSV column name or SQL expression.}
        type:
          type: integer
          minimum: 0
          maximum: 6
          description: |
            Domain mapping type. 0 RENAME, 1 SQL, 2 PREFIX_PATTERN, 3 CUSTOM,
            4 EXTRA_FIELDS, 5 MISSING_MAPPINGS, 6 ARRAY.
        primaryKey: {type: boolean}
        useInDeleteFilter: {type: boolean}
        isRequiredPartitionFilter: {type: boolean}
    Template:
      type: object
      required: [partnerType, importType, label, columns, defaults]
      properties:
        partnerType: {type: string}
        importType: {type: string}
        label: {type: string}
        columns:
          type: array
          items: {$ref: "#/components/schemas/TemplateColumn"}
        defaults: {$ref: "#/components/schemas/LoadConfig"}
    TemplateColumn:
      type: object
      required: [name, bqType, required, description]
      properties:
        name: {type: string}
        bqType: {type: string}
        required: {type: boolean}
        description: {type: string}
        formatHint: {type: string}
    Identity:
      type: object
      required: [kind, organizationName, nestedName, fileType]
      properties:
        kind: {type: string, enum: [advertiser, publisher]}
        organizationName:
          type: string
          example: bigmat_france
        nestedName:
          type: string
          description: Advertiser account name, or publisher base name.
          example: bigmat
        fileType:
          type: string
          enum: [optin, optout, blacklists, customers, stores, sales]
    LoadConfigWrite:
      type: object
      description: |
        Fields the console sends. Derived fields (`id`, `publisherName`,
        `patterns`, `notification`, `destination`, `organization`) are ignored
        when present.
      required: [kind, organizationName, nestedName, fileType, mode, bqParams, mappings]
      properties:
        kind: {type: string, enum: [advertiser, publisher]}
        organizationName: {type: string, example: BigMat France}
        nestedName: {type: string, example: bigmat}
        fileType:
          type: string
          enum: [optin, optout, blacklists, customers, stores, sales]
        mode: {type: string, enum: [APPEND, INCREMENTAL, OVERWRITE]}
        bqParams: {$ref: "#/components/schemas/BQParams"}
        mappings:
          type: object
          additionalProperties: {$ref: "#/components/schemas/Mapping"}
    DerivedConfig:
      type: object
      required: [id, publisherName, patterns, notification, destination, organization, warnings]
      properties:
        id: {type: string, example: bigmat_france:bigmat:sales}
        publisherName: {type: string, example: bigmat_france:bigmat:sales}
        patterns: {$ref: "#/components/schemas/Patterns"}
        notification: {$ref: "#/components/schemas/Notification"}
        destination: {$ref: "#/components/schemas/Destination"}
        organization: {$ref: "#/components/schemas/Organization"}
        warnings:
          type: array
          items: {$ref: "#/components/schemas/FieldIssue"}
    NamedRef:
      type: object
      required: [name, slug]
      properties:
        id:
          type: string
          description: Absent for publisher bases.
        name: {type: string}
        slug: {type: string}
    Meta:
      type: object
      required: [modes, mappingTypes, sourceFormats, partnerTypes, importTypes]
      properties:
        modes:
          type: array
          items: {type: string}
        mappingTypes:
          type: array
          items:
            type: object
            required: [value, label]
            properties:
              value: {type: integer}
              label: {type: string}
        sourceFormats:
          type: array
          items:
            type: object
            required: [value, label]
            properties:
              value: {type: integer, enum: [0, 1]}
              label: {type: string, enum: [CSV, JSON]}
        partnerTypes:
          type: array
          items: {type: string}
        importTypes:
          type: object
          additionalProperties:
            type: array
            items: {type: string}
          example:
            publisher: [optin, optout]
            advertiser: [blacklists, customers, stores, sales]
    SFTPConfig:
      type: object
      required: [configured, clientTypes, buckets]
      properties:
        configured:
          type: boolean
          description: False when SFTPGO_URL or SFTPGO_API_KEY is unset.
        clientTypes: {$ref: "#/components/schemas/SFTPClientTypes"}
        buckets: {$ref: "#/components/schemas/SFTPBuckets"}
    SFTPClientTypes:
      type: object
      required: [publisher, advertiser]
      properties:
        publisher:
          type: array
          items: {type: string}
          example: [optin, optout, stop]
        advertiser:
          type: array
          items: {type: string}
          example: [blacklists, customers, stores, sales]
    SFTPBuckets:
      type: object
      required: [publisher, advertiser]
      properties:
        publisher: {type: string, example: dkp-dmc-publishers-raw-euw1-dev}
        advertiser: {type: string, example: dkp-dmc-advertisers-raw-euw1-dev}
    SFTPAccount:
      type: object
      required: [username, exists, virtualFolders, bases]
      properties:
        username: {type: string}
        exists: {type: boolean}
        bucket:
          type: string
          description: GCS bucket of the user's filesystem. Omitted when the user does not exist.
        virtualFolders:
          type: array
          items: {$ref: "#/components/schemas/SFTPVirtualFolder"}
        bases:
          type: array
          items: {type: string}
    SFTPVirtualFolder:
      type: object
      required: [name, virtualPath]
      properties:
        name: {type: string, example: acme/base_fr/optin}
        virtualPath: {type: string, example: /base_fr/optin}
    SFTPAccountRequest:
      type: object
      required: [user, base, clientType]
      properties:
        user:
          type: string
          description: SFTP username. Must match `^[a-z0-9][a-z0-9_-]*$`.
        base:
          type: string
          description: Client base name. Same pattern as `user`.
        clientType:
          type: string
          enum: [publisher, advertiser]
        passwordMode:
          type: string
          enum: [generate, none]
          default: generate
        publicKeys:
          type: array
          items: {type: string}
          description: Required when passwordMode is none. Applied only when the user is created.
    SFTPPlan:
      type: object
      required: [user, base, clientType, bucket, subfolders, folders, userAction, warnings]
      properties:
        user: {type: string}
        base: {type: string}
        clientType: {type: string, enum: [publisher, advertiser]}
        bucket: {type: string}
        subfolders:
          type: array
          items: {type: string}
        folders:
          type: array
          items: {$ref: "#/components/schemas/SFTPPlannedFolder"}
        userAction:
          type: string
          enum: [create, update, unchanged]
        warnings:
          type: array
          items: {type: string}
          description: |
            Notes that do not block the plan. An existing user includes
            "existing password is kept". Public keys sent for an existing user
            include "public keys are only applied when the user is created".
    SFTPPlannedFolder:
      type: object
      required: [name, virtualPath, action]
      properties:
        name: {type: string}
        virtualPath: {type: string}
        action: {type: string, enum: [create, exists]}
    SFTPApplyResult:
      type: object
      required: [user, base, clientType, bucket, subfolders, foldersCreated, foldersExisting, userAction, addedVirtualFolders, verified]
      properties:
        user: {type: string}
        base: {type: string}
        clientType: {type: string, enum: [publisher, advertiser]}
        bucket: {type: string}
        subfolders:
          type: array
          items: {type: string}
        foldersCreated:
          type: array
          items: {type: string}
        foldersExisting:
          type: array
          items: {type: string}
        userAction:
          type: string
          enum: [created, updated, unchanged]
        addedVirtualFolders: {type: integer}
        generatedPassword:
          type: string
          description: Present only when a user was created with passwordMode generate. Returned once and never logged.
        verified: {type: boolean}
        missing:
          type: array
          items: {type: string}
          description: Virtual paths missing after the write. Omitted when verification succeeds.
